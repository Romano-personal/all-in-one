<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hi Romano</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#F7F7F7">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #F7F7F7;
      --bg-card: #FFFFFF;
      --border-subtle: #E5E7EB;
      --ink-black: #111111;
      --btn-navy: #141B2D;
    }

    /* Requirement #5: Disable text selection & long-press callout globally */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Keep text inputs selectable so typing works normally */
    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--ink-black);
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    .b-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 26px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.025);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .b-input {
      background: #F9FAFB;
      border: 1.5px solid var(--border-subtle);
      color: var(--ink-black);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .b-input:focus {
      background: #FFFFFF;
      border-color: var(--ink-black);
    }

    .b-btn-primary {
      background: var(--btn-navy);
      color: #FFFFFF;
      border-radius: 16px;
      font-weight: 700;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .b-btn-primary:active {
      transform: scale(0.97);
    }
    .b-btn-primary:disabled {
      opacity: 0.5;
    }

    .b-tag {
      background: #F3F4F6;
      border: 1.5px solid transparent;
      color: #374151;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      transition: all 0.12s ease;
    }
    .b-tag-active {
      background: #FFFFFF !important;
      border-color: var(--ink-black) !important;
      color: var(--ink-black) !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* Requirement #6: Smooth View Transition Animation */
    @keyframes viewSmoothIn {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .view-animate {
      animation: viewSmoothIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Light, high-transparency blur when Bot Menu is open */
    #appContentWrapper {
      transition: filter 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.menu-open #appContentWrapper {
      filter: blur(3.5px);
      opacity: 0.55;
      transform: scale(0.99);
      pointer-events: none;
    }

    /* Agent Overlay Items Staggered Pop */
    .agent-item {
      opacity: 0;
      transform: translateY(12px) scale(0.95);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    body.menu-open .agent-item {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    body.menu-open .agent-item:nth-child(1) { transition-delay: 0.015s; }
    body.menu-open .agent-item:nth-child(2) { transition-delay: 0.045s; }
    body.menu-open .agent-item:nth-child(3) { transition-delay: 0.075s; }
    body.menu-open .agent-item:nth-child(4) { transition-delay: 0.105s; }

    /* Highlight state when dragging finger over an Agent item */
    .agent-item.drag-hover {
      border-color: #111111 !important;
      background: #FFFFFF !important;
      transform: scale(1.045) translateX(6px) !important;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1) !important;
    }

    @keyframes mini-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }
    .mini-bot-svg {
      animation: mini-float 2.8s ease-in-out infinite;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="flex justify-center">

  <!-- MAIN MOBILE FULL-HEIGHT CONTAINER -->
  <div class="w-full max-w-md min-h-[100dvh] flex flex-col px-5 pt-6 pb-28 relative">

    <!-- ==================== WRAPPED CONTENT (STRETCHES TO FILL PHONE SCREEN) ==================== -->
    <div id="appContentWrapper" class="flex-1 flex flex-col">

      <!-- HEADER: Hi Romano -->
      <header class="flex items-center justify-between pt-1 pb-4 shrink-0">
        <div class="flex items-center gap-3">
          <h1 class="text-3xl font-extrabold tracking-tight text-[#111111]">Hi Romano</h1>
          <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-[#34C77B] transition-colors" title="Synced"></span>
        </div>
        <span id="currentViewBadge" class="text-xs font-extrabold uppercase tracking-widest text-gray-400 hidden">SCHEDULE</span>
      </header>

      <!-- ==================== VIEW 0: HOME DASHBOARD (STRETCHES TO FILL SCREEN) ==================== -->
      <main id="viewHome" class="flex-1 flex flex-col justify-between gap-4 view-animate">

        <!-- 1. GSAT COUNTDOWN (Larger & Fuller) -->
        <div class="b-card p-6 flex flex-col justify-between shrink-0">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold uppercase tracking-widest text-gray-400">GSAT COUNTDOWN</span>
            <button onclick="promptGsatDate()" class="text-xs font-bold text-gray-400 hover:text-black transition" id="gsatTargetLabel">2027.01.22</button>
          </div>
          <div class="mt-3 flex items-baseline gap-3">
            <span id="gsatDaysLeft" class="text-7xl font-black tracking-tighter leading-none text-[#111111]">94</span>
            <span class="text-xl font-bold text-gray-400">days</span>
          </div>
        </div>

        <!-- 2. UPCOMING EVENTS (3 Slots + Larger Text) -->
        <div class="b-card p-6 flex flex-col justify-between space-y-3.5 shrink-0">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold uppercase tracking-widest text-gray-400">UPCOMING EVENTS</span>
            <button onclick="loadUpcomingEvents()" class="text-gray-400 hover:text-black text-sm transition p-1" title="Refresh">
              <i class="fa-solid fa-rotate-right" id="eventsRefreshIcon"></i>
            </button>
          </div>
          <div id="upcomingEventsList" class="space-y-2.5"></div>
        </div>

        <!-- 3. BOTTOM SPLIT: STRETCHES TO FILL REMAINING VERTICAL SPACE -->
        <div class="grid grid-cols-12 gap-4 flex-1 min-h-[220px]">
          
          <!-- Left Column: Time + Location -->
          <div class="col-span-5 flex flex-col gap-4">
            <div class="b-card p-5 flex flex-col justify-center items-center flex-1">
              <div id="homeClock" class="text-3xl font-extrabold tracking-tight text-[#111111] tabular-nums">21:47</div>
              <div id="homeDate" class="text-xs font-bold text-gray-400 mt-1">OCT 20</div>
            </div>

            <button onclick="pingSatellite()" class="b-card p-4 text-left hover:border-black transition flex flex-col justify-between shrink-0">
              <div class="flex items-center justify-between w-full">
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-gray-400">LOCATION</span>
                <span id="locPingDot" class="w-2 h-2 rounded-full bg-[#34C77B]"></span>
              </div>
              <div id="trackerSubLocation" class="text-sm font-extrabold text-[#111111] mt-2 truncate">24.8, 121.0</div>
            </button>
          </div>

          <!-- Right Column: Google Tasks TO-DO -->
          <div class="col-span-7 b-card p-5 flex flex-col justify-between">
            <div class="flex-1 flex flex-col min-h-0">
              <div class="flex items-center justify-between mb-3 shrink-0">
                <span class="text-xs font-extrabold uppercase tracking-widest text-gray-400">TO-DO</span>
                <button onclick="syncGoogleTasks()" class="text-xs text-gray-400 hover:text-black transition p-1" title="Sync Google Tasks">
                  <i class="fa-solid fa-rotate" id="tasksSyncIcon"></i>
                </button>
              </div>
              <div id="todoListContainer" class="space-y-2 overflow-y-auto no-scrollbar pr-0.5 flex-1"></div>
            </div>

            <div class="flex items-center gap-2 pt-3 mt-2 border-t border-gray-100 shrink-0">
              <input type="text" id="newTodoInput" placeholder="New task..." onkeydown="if(event.key==='Enter')addTodoItem()" class="w-full text-sm font-semibold bg-transparent outline-none text-[#111111] placeholder-gray-400">
              <button onclick="addTodoItem()" class="text-gray-400 hover:text-black text-base px-1.5 font-bold">+</button>
            </div>
          </div>

        </div>
      </main>

      <!-- ==================== VIEW 1: SCHEDULE ==================== -->
      <section id="tabSchedule" class="hidden space-y-4">
        <div class="b-card p-5 space-y-4">
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="text-xs font-extrabold uppercase tracking-wider text-gray-400">CALENDAR</label>
              <button onclick="loadUserCalendars()" class="text-xs font-bold text-gray-400 hover:text-black">Reload</button>
            </div>
            <select id="calendarSelect" class="w-full b-input px-3.5 py-2.5 text-sm font-semibold">
              <option value="primary">Primary</option>
            </select>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="text-xs font-extrabold uppercase tracking-wider text-gray-400">TITLE</label>
              <button onclick="openModal('title')" class="text-xs font-bold text-gray-400 hover:text-black">Edit</button>
            </div>
            <div class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto no-scrollbar mb-2.5" id="titleTags"></div>
            <input type="text" id="eventTitle" placeholder="Event title..." oninput="clearTitleHighlight()" class="w-full b-input px-3.5 py-2.5 text-sm font-semibold">
          </div>

          <div>
            <label class="text-xs font-extrabold uppercase tracking-wider text-gray-400 block mb-1.5">DATE</label>
            <input type="date" id="eventDate" oninput="clearDateButtonHighlight()" class="w-full b-input px-3.5 py-2.5 text-sm font-semibold mb-2">
            <div class="grid grid-cols-3 gap-2">
              <button type="button" onclick="handleQuickDateClick(0, this)" class="b-tag text-center date-quick-btn">Today</button>
              <button type="button" onclick="handleQuickDateClick(1, this)" class="b-tag text-center date-quick-btn">+1 Day</button>
              <button type="button" onclick="handleQuickDateClick(2, this)" class="b-tag text-center date-quick-btn">+2 Days</button>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="text-xs font-extrabold uppercase tracking-wider text-gray-400">TIME</label>
              <button onclick="openModal('time')" class="text-xs font-bold text-gray-400 hover:text-black">Edit</button>
            </div>
            <div class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto no-scrollbar mb-2.5" id="timeTags"></div>
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <span class="text-[11px] font-bold text-gray-400 block mb-1">START</span>
                <input type="time" id="startTime" class="w-full b-input px-3 py-2 text-sm font-semibold">
              </div>
              <div>
                <span class="text-[11px] font-bold text-gray-400 block mb-1">END</span>
                <input type="time" id="endTime" class="w-full b-input px-3 py-2 text-sm font-semibold">
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-2.5 pt-1">
            <input type="text" id="eventLocation" placeholder="Location (optional)" class="w-full b-input px-3.5 py-2.5 text-sm">
            <textarea id="eventDesc" rows="2" placeholder="Notes..." class="w-full b-input px-3.5 py-2.5 text-sm"></textarea>
          </div>

          <button id="submitBtn" onclick="submitEvent()" class="b-btn-primary w-full py-3.5 text-sm tracking-wide">
            <span class="btn-text">Add Event</span>
          </button>
        </div>
      </section>

      <!-- ==================== VIEW 2: TIMETABLE ==================== -->
      <section id="tabTimetable" class="hidden space-y-3.5">
        <div class="b-card p-3.5 flex items-center justify-between">
          <button onclick="navigateWeek(-1)" class="px-3.5 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-xs font-bold">&lt;</button>
          <div class="text-center cursor-pointer" onclick="navigateWeek(0)">
            <div id="weekRangeLabel" class="text-sm font-extrabold text-[#111111]">...</div>
            <div id="weekRelativeLabel" class="text-[11px] font-semibold text-gray-400">Current</div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="openSwapModal()" class="px-3 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-xs font-bold">Swap</button>
            <button onclick="navigateWeek(1)" class="px-3.5 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-xs font-bold">&gt;</button>
          </div>
        </div>

        <div id="activeSwapsBanner" class="hidden px-4 py-2.5 b-card text-xs font-semibold flex justify-between items-center border-amber-300 bg-amber-50/60">
          <span><span id="swapCountText">0</span> active swaps</span>
          <button onclick="openSwapListModal()" class="underline font-bold text-xs">View</button>
        </div>

        <div class="b-card p-3.5 space-y-3">
          <div class="overflow-x-auto no-scrollbar rounded-xl border border-gray-200">
            <table class="w-full text-center border-collapse table-fixed min-w-[310px]">
              <thead>
                <tr class="border-b border-gray-200 text-[11px] text-gray-400 bg-gray-50" id="timetableHeaderRow"></tr>
              </thead>
              <tbody id="timetableBody" class="divide-y divide-gray-100 text-xs"></tbody>
            </table>
          </div>
          <button id="syncMatrixBtn" onclick="saveTimetableToCloud()" class="b-btn-primary w-full py-3 text-sm">
            <span class="btn-text">Save Timetable</span>
          </button>
        </div>
      </section>

      <!-- ==================== VIEW 3: TRACKER ==================== -->
      <section id="tabTracker" class="hidden space-y-4">
        <div class="b-card p-5 space-y-3">
          <label class="text-xs font-extrabold uppercase tracking-wider text-gray-400 block">SUBJECT</label>
          <div class="grid grid-cols-4 gap-2" id="subject-selector">
            <button onclick="setSubject('國文')" class="b-tag text-center" data-subj="國文">國文</button>
            <button onclick="setSubject('英文')" class="b-tag text-center" data-subj="英文">英文</button>
            <button onclick="setSubject('數學')" class="b-tag b-tag-active text-center" data-subj="數學">數學</button>
            <button onclick="setSubject('物理')" class="b-tag text-center" data-subj="物理">物理</button>
            <button onclick="setSubject('化學')" class="b-tag text-center" data-subj="化學">化學</button>
            <button onclick="setSubject('生物')" class="b-tag text-center" data-subj="生物">生物</button>
            <button onclick="setSubject('地科')" class="b-tag text-center" data-subj="地科">地科</button>
          </div>
        </div>

        <div class="b-card p-6 text-center space-y-4">
          <div class="flex justify-between items-center text-xs">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-gray-300" id="pulse-dot"></span>
              <span id="terminal-state" class="font-extrabold text-gray-400 text-xs">IDLE</span>
            </div>
            <span id="current-track-badge" class="px-3 py-1 rounded-full bg-gray-100 text-[#111111] font-extrabold text-xs">數學</span>
          </div>

          <div class="py-4">
            <div class="text-5xl font-black tracking-tight text-[#111111] tabular-nums" id="timer-display">00:00:00</div>
            <p class="text-xs font-semibold text-gray-400 mt-1.5" id="timer-status">Ready</p>
          </div>

          <div id="timer-actions">
            <button id="start-btn" onclick="startTimer()" class="b-btn-primary w-full py-3.5 text-sm">
              <span class="btn-text">Start</span>
            </button>
            <div id="running-actions" class="hidden grid grid-cols-2 gap-2.5">
              <button id="pause-resume-btn" onclick="togglePauseResume()" class="py-3.5 rounded-2xl bg-gray-100 hover:bg-gray-200 font-bold text-sm text-[#111111]">
                <span class="btn-text">Pause</span>
              </button>
              <button id="commit-timer-btn" onclick="commitTimer()" class="b-btn-primary py-3.5 text-sm !bg-[#EA4335]">
                <span class="btn-text">Finish</span>
              </button>
            </div>
          </div>
        </div>

        <div class="b-card p-5 space-y-3.5">
          <div class="flex justify-between items-center">
            <span class="text-xs font-extrabold uppercase tracking-wider text-gray-400">TOPICS & NOTES</span>
            <button onclick="clearSelectedUnits()" class="text-xs font-bold text-gray-400 hover:text-black">Clear</button>
          </div>
          <div id="unit-tag-container" class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto no-scrollbar"></div>
          <div class="text-xs text-gray-400">Selected: <span id="selected-units-preview" class="font-bold text-[#111111]">None</span></div>

          <div class="flex items-center justify-between py-2 px-3.5 rounded-xl bg-gray-50 border border-gray-100">
            <span class="text-xs font-bold">Completed</span>
            <input type="checkbox" id="is-completed" class="w-4 h-4 accent-black" checked>
          </div>

          <input type="text" id="note-input" placeholder="Session notes..." class="w-full b-input px-3.5 py-2.5 text-sm">
          <button id="progress-btn" onclick="saveProgress()" class="b-btn-primary w-full py-3 text-sm">
            <span class="btn-text">Save Progress</span>
          </button>
        </div>
      </section>

      <!-- ==================== VIEW 4: SETTINGS ==================== -->
      <section id="tabSettings" class="hidden space-y-4">
        <div class="b-card p-5 space-y-3">
          <div class="flex justify-between items-center">
            <label class="text-xs font-extrabold uppercase tracking-wider text-gray-400">VISIBLE CALENDARS (HOME)</label>
            <button onclick="loadUserCalendars()" class="text-xs font-bold text-gray-400 hover:text-black">Sync</button>
          </div>
          <div id="settingsCalendarCheckboxes" class="space-y-2 max-h-48 overflow-y-auto no-scrollbar"></div>
        </div>

        <div class="b-card p-5 space-y-3">
          <div class="flex justify-between items-center">
            <label class="text-xs font-extrabold uppercase tracking-wider text-gray-400">SUBJECT COLORS</label>
            <button onclick="addCustomSubjectPrompt()" class="text-xs font-bold text-[#111111]">+ Add</button>
          </div>
          <div id="subjectColorList" class="space-y-2 max-h-52 overflow-y-auto no-scrollbar"></div>
        </div>

        <div class="b-card p-5 space-y-3 text-sm font-semibold">
          <div class="flex justify-between items-center">
            <span>Periods / Day</span>
            <select id="settingTotalPeriods" onchange="updateTotalPeriods(this.value)" class="b-input px-3 py-1.5 text-xs font-bold">
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8" selected>8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <div class="flex justify-between items-center">
            <span>Swap Indicator</span>
            <input type="checkbox" id="settingShowSwapPulse" checked onchange="toggleSwapPulse(this.checked)" class="w-4 h-4 accent-black">
          </div>
        </div>

        <button id="saveSettingsBtn" onclick="saveAllSettingsToCloud()" class="b-btn-primary w-full py-3.5 text-sm">
          <span class="btn-text">Save Settings</span>
        </button>
      </section>

    </div>

    <!-- ==================== FLOATING AGENT MENU OVERLAY ==================== -->
    <div id="agentOverlay" onclick="handleOverlayClick(event)" class="fixed inset-0 z-40 hidden flex-col justify-center items-center px-6 bg-white/10">
      <div class="w-full max-w-xs space-y-4">
        
        <!-- 1. Circle -> SCHEDULE -->
        <button data-agent-tab="schedule" data-agent-shape="circle" data-agent-color="#111111" onclick="selectAgent('schedule', 'circle', '#111111')" class="agent-item w-full b-card p-4 flex items-center gap-4 hover:border-black active:scale-95">
          <svg class="w-12 h-12 shrink-0 mini-bot-svg pointer-events-none" viewBox="0 0 100 100">
            <path d="M 50,12 A 38,38 0 1,1 49.99,12 Z" fill="#111111"/>
            <g class="mini-eyes" fill="#FFFFFF">
              <rect x="36" y="34" width="7.5" height="16" rx="3.75"/>
              <rect x="54" y="34" width="7.5" height="16" rx="3.75"/>
            </g>
          </svg>
          <span class="text-lg font-extrabold tracking-tight text-[#111111] pointer-events-none">SCHEDULE</span>
        </button>

        <!-- 2. Triangle -> TIMETABLE -->
        <button data-agent-tab="timetable" data-agent-shape="triangle" data-agent-color="#34C77B" onclick="selectAgent('timetable', 'triangle', '#34C77B')" class="agent-item w-full b-card p-4 flex items-center gap-4 hover:border-black active:scale-95">
          <svg class="w-12 h-12 shrink-0 mini-bot-svg pointer-events-none" style="animation-delay: 0.4s" viewBox="0 0 100 100">
            <path d="M 43,16 Q 50,6 57,16 L 86,72 Q 92,84 79,84 L 21,84 Q 8,84 14,72 Z" fill="#34C77B"/>
            <g class="mini-eyes" fill="#FFFFFF">
              <rect x="38" y="47" width="6.5" height="13.5" rx="3.25"/>
              <rect x="53" y="47" width="6.5" height="13.5" rx="3.25"/>
            </g>
          </svg>
          <span class="text-lg font-extrabold tracking-tight text-[#111111] pointer-events-none">TIMETABLE</span>
        </button>

        <!-- 3. Hexagon -> TRACKER -->

  <script>
    // =========================================================
    // FAST GAS API BRIDGE + LOCAL STORAGE INSTANT CACHE
    // =========================================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwO5uOOWyuU3wmYwcZuiTpM7JlUTBtcgPtZrsVvG5DWjJJo5sY7-ciN9zSdm0GhGRWj/exec";

    let activeRequests = 0;

    function setSyncIndicator(busy) {
      const dot = document.getElementById('syncDot');
      if (!dot) return;
      dot.style.backgroundColor = busy ? '#F5B82E' : '#34C77B';
    }

    // Parallel-friendly, low-latency API caller (no 250ms artificial bottleneck)
    function callBackend(action, payload, onSuccess, onFailure) {
      activeRequests++;
      setSyncIndicator(true);

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && onSuccess) onSuccess(data.data);
        else if (!data.success && onFailure) onFailure(new Error(data.message || "API Error"));
      })
      .catch(err => {
        if (onFailure) onFailure(err);
      })
      .finally(() => {
        activeRequests = Math.max(0, activeRequests - 1);
        setSyncIndicator(activeRequests > 0);
      });
    }

    // =========================================================
    // STORAGE & STATE (INSTANT CACHEHYDRATION)
    // =========================================================
    var EvStore = {
      get: function(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
      set: function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} },
      del: function(k) { try { localStorage.removeItem(k); } catch(e) {} },
      getJSON: function(k, fallback) {
        try {
          const raw = localStorage.getItem(k);
          return raw ? JSON.parse(raw) : fallback;
        } catch(e) { return fallback; }
      },
      setJSON: function(k, obj) {
        try { localStorage.setItem(k, JSON.stringify(obj)); } catch(e) {}
      }
    };

    var currentView = 'home';
    var currentBotShape = 'circle';
    var currentBotColor = '#111111';
    var isMenuOpen = false;

    var allUserCalendars = EvStore.getJSON('romano_cache_cals', []);
    var visibleCalendarIds = EvStore.getJSON('romano_visible_cals', ['primary']);
    var cachedUpcomingEvents = EvStore.getJSON('romano_cache_events', []);
    var todoItems = EvStore.getJSON('romano_cache_tasks', []);

    var dbTitles = EvStore.getJSON('romano_cache_titles', ["國文作業", "國文考試", "數學作業", "數學考試", "英文作業", "英文考試", "物理作業", "物理考試", "化學作業", "化學考試", "自習", "讀書"]);
    var dbTimes = EvStore.getJSON('romano_cache_times', [
      { label: "P1", start: "08:10", end: "09:00" }, { label: "P2", start: "09:10", end: "10:00" },
      { label: "P3", start: "10:10", end: "11:00" }, { label: "P4", start: "11:10", end: "12:00" },
      { label: "P5", start: "13:15", end: "14:05" }, { label: "P6", start: "14:15", end: "15:05" },
      { label: "P7", start: "15:15", end: "16:05" }, { label: "P8", start: "16:10", end: "17:00" }
    ]);
    var dbSubjects = EvStore.getJSON('romano_cache_subjects', ["國文", "英文", "數學", "物理", "化學", "生物", "地科", "歷史", "地理", "公民", "體育", "自習"]);
    var dbSubjectColors = EvStore.getJSON('romano_cache_subj_colors', {
      "國文": "#EA4335", "英文": "#3B96F3", "數學": "#F28B30", "物理": "#34C77B",
      "化學": "#7B61FF", "生物": "#2CC597", "地科": "#8C6239", "體育": "#E5489A"
    });
    var appSettings = EvStore.getJSON('romano_cache_settings', { totalPeriods: 8, showSwapPulse: true });
    var timetableData = EvStore.getJSON('romano_cache_timetable', Array(10).fill(null).map(() => Array(5).fill('')));
    var swapRecords = EvStore.getJSON('romano_cache_swaps', []);
    var unitsCache = EvStore.getJSON('romano_cache_units', {});

    var currentWeekOffset = 0, editingTimeIndex = null, selectedTitle = null, selectedDateOffset = null, selectedTimeLabel = null;
    var periodTimes = dbTimes.slice();
    var currentSwapMode = 'two', multiSwapSteps = [];
    var currentSubject = '數學';
    var timerState = 'IDLE', currentSegmentStartMs = null, accumulatedMs = 0, timerInterval = null;
    var selectedUnits = [];

    // =========================================================
    // REQUIREMENT #1: CRISP GEOMETRIC SHAPES (NO JELLY WAVES)
    // =========================================================
    const CRISP_BOT_SHAPES = {
      circle: {
        d: "M 50,12 A 38,38 0 1,1 49.99,12 Z",
        strokeWidth: 0,
        eyeY: 34
      },
      triangle: {
        d: "M 43,16 Q 50,6 57,16 L 86,72 Q 92,84 79,84 L 21,84 Q 8,84 14,72 Z",
        strokeWidth: 0,
        eyeY: 46
      },
      hexagon: {
        d: "M 29,15 L 71,15 L 91,50 L 71,85 L 29,85 L 9,50 Z",
        strokeWidth: 8,
        eyeY: 35
      },
      squircle: {
        d: "M 32,14 L 68,14 Q 86,14 86,32 L 86,68 Q 86,86 68,86 L 32,86 Q 14,86 14,68 L 14,32 Q 14,14 32,14 Z",
        strokeWidth: 0,
        eyeY: 35
      }
    };

    let pressScale = 1;
    let targetPressScale = 1;

    function triggerBotTapEffect() {
      targetPressScale = 0.93;
      setTimeout(() => { targetPressScale = 1; }, 130);
    }

    function setBotAppearance(shapeKey, colorHex) {
      const cfg = CRISP_BOT_SHAPES[shapeKey] || CRISP_BOT_SHAPES.circle;
      const body = document.getElementById('mainBotBody');
      const eyeL = document.getElementById('botEyeL');
      const eyeR = document.getElementById('botEyeR');
      if (!body) return;

      body.setAttribute('d', cfg.d);
      body.setAttribute('fill', colorHex);
      body.setAttribute('stroke', colorHex);
      body.setAttribute('stroke-width', cfg.strokeWidth);

      if (eyeL && eyeR) {
        eyeL.setAttribute('y', cfg.eyeY);
        eyeR.setAttribute('y', cfg.eyeY);
      }
    }

    function initAutonomousBotLife() {
      const actorGroup = document.getElementById('mainBotActor');
      const eyesGroup = document.getElementById('mainBotEyes');
      const shadowEl = document.getElementById('mainBotShadow');

      setBotAppearance('circle', '#111111');

      let targetGazeX = 0, targetGazeY = 0, curGazeX = 0, curGazeY = 0;
      let blinkScaleY = 1;

      setInterval(() => {
        if (Math.random() < 0.3) {
          targetGazeX = 0; targetGazeY = 0;
        } else {
          targetGazeX = (Math.random() - 0.5) * 11;
          targetGazeY = (Math.random() - 0.5) * 7;
        }
      }, 2400);

      function scheduleBlink() {
        const nextDelay = 2200 + Math.random() * 3400;
        setTimeout(() => {
          blinkScaleY = 0.08;
          setTimeout(() => {
            blinkScaleY = 1;
            if (Math.random() < 0.25) {
              setTimeout(() => {
                blinkScaleY = 0.08;
                setTimeout(() => { blinkScaleY = 1; }, 100);
              }, 115);
            }
          }, 110);
          scheduleBlink();
        }, nextDelay);
      }
      scheduleBlink();

      function animateFrame(nowMs) {
        const t = nowMs * 0.001;

        pressScale += (targetPressScale - pressScale) * 0.25;
        curGazeX += (targetGazeX - curGazeX) * 0.1;
        curGazeY += (targetGazeY - curGazeY) * 0.1;

        // Clean vertical float + subtle gaze lean (no shape distortion)
        const floatY = Math.sin(t * 2.1) * 2.8;
        const bodyShiftX = curGazeX * 0.22;

        actorGroup.setAttribute(
          'transform',
          `translate(${(50 + bodyShiftX).toFixed(2)}, ${(50 + floatY).toFixed(2)}) scale(${pressScale.toFixed(3)}) translate(-50, -50)`
        );

        const shadowRx = 23 - floatY * 0.6;
        shadowEl.setAttribute('rx', shadowRx.toFixed(1));

        eyesGroup.setAttribute(
          'transform',
          `translate(${curGazeX.toFixed(2)}, ${curGazeY.toFixed(2)}) translate(48, 42) scale(1, ${blinkScaleY}) translate(-48, -42)`
        );

        document.querySelectorAll('.mini-eyes').forEach((el, idx) => {
          const ox = Math.sin(t * 1.5 + idx * 1.7) * 3.2;
          const oy = Math.cos(t * 1.2 + idx * 1.3) * 1.8;
          el.setAttribute('transform', `translate(${ox.toFixed(1)}, ${oy.toFixed(1)})`);
        });

        requestAnimationFrame(animateFrame);
      }
      requestAnimationFrame(animateFrame);
    }

    // =========================================================
    // REQUIREMENT #6: TAP + HOLD-DRAG-RELEASE (RETURNS TO CURRENT VIEW IF NOT SELECTED)
    // =========================================================
    function initBotGestures() {
      const botBtn = document.getElementById('bloubBotBtn');
      let pressTimer = null;
      let isPointerDown = false;
      let isHoldSession = false;
      let hoveredAgentBtn = null;

      function clearAgentHighlights() {
        document.querySelectorAll('.agent-item').forEach(btn => btn.classList.remove('drag-hover'));
        hoveredAgentBtn = null;
      }

      botBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        isPointerDown = true;
        isHoldSession = false;
        hoveredAgentBtn = null;
        triggerBotTapEffect();

        try { botBtn.setPointerCapture(e.pointerId); } catch (err) {}

        // Hold for 170ms -> pop open the 4 Agent menu
        pressTimer = setTimeout(() => {
          if (isPointerDown) {
            isHoldSession = true;
            if (!isMenuOpen) {
              openAgentMenu();
              if (navigator.vibrate) navigator.vibrate(10);
            }
          }
        }, 170);
      });

      botBtn.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;

        if (!isMenuOpen) {
          const rect = botBtn.getBoundingClientRect();
          const dist = Math.hypot(e.clientX - (rect.left + rect.width / 2), e.clientY - (rect.top + rect.height / 2));
          if (dist > 16) {
            clearTimeout(pressTimer);
            isHoldSession = true;
            openAgentMenu();
          }
        }

        if (isMenuOpen) {
          const elUnderFinger = document.elementFromPoint(e.clientX, e.clientY);
          const agentBtn = elUnderFinger ? elUnderFinger.closest('[data-agent-tab]') : null;

          if (agentBtn !== hoveredAgentBtn) {
            clearAgentHighlights();
            if (agentBtn) {
              agentBtn.classList.add('drag-hover');
              hoveredAgentBtn = agentBtn;
              setBotAppearance(agentBtn.dataset.agentShape, agentBtn.dataset.agentColor);
              if (navigator.vibrate) navigator.vibrate(6);
            } else {
              // Restore current view's bot appearance when finger leaves cards
              setBotAppearance(currentBotShape, currentBotColor);
            }
          }
        }
      });

      function finishGesture() {
        if (!isPointerDown) return;
        isPointerDown = false;
        clearTimeout(pressTimer);

        // Case 1: Finger released over one of the 4 Agent items -> navigate to it
        if (isMenuOpen && hoveredAgentBtn) {
          const tab = hoveredAgentBtn.dataset.agentTab;
          const shape = hoveredAgentBtn.dataset.agentShape;
          const color = hoveredAgentBtn.dataset.agentColor;
          clearAgentHighlights();
          selectAgent(tab, shape, color);
          return;
        }

        clearAgentHighlights();

        // Case 2: It was a Long-Press / Drag session, but released on empty space
        // -> Close menu and stay on current view!
        if (isHoldSession) {
          closeAgentMenu();
          setBotAppearance(currentBotShape, currentBotColor);
          return;
        }

        // Case 3: Short Tap
        if (isMenuOpen) {
          closeAgentMenu();
        } else if (currentView !== 'home') {
          showHomeView();
        } else {
          openAgentMenu();
        }
      }

      botBtn.addEventListener('pointerup', finishGesture);
      botBtn.addEventListener('pointercancel', () => {
        isPointerDown = false;
        clearTimeout(pressTimer);
        clearAgentHighlights();
        if (isHoldSession) closeAgentMenu();
      });
    }

    function openAgentMenu() {
      isMenuOpen = true;
      document.body.classList.add('menu-open');
      const overlay = document.getElementById('agentOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeAgentMenu() {
      isMenuOpen = false;
      document.body.classList.remove('menu-open');
      const overlay = document.getElementById('agentOverlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'agentOverlay') {
        closeAgentMenu();
        setBotAppearance(currentBotShape, currentBotColor);
      }
    }

    function animateSectionEntry(el) {
      el.classList.remove('view-animate');
      void el.offsetWidth;
      el.classList.add('view-animate');
    }

    function showHomeView() {
      currentView = 'home';
      currentBotShape = 'circle';
      currentBotColor = '#111111';

      ['Schedule', 'Timetable', 'Tracker', 'Settings'].forEach(name => {
        document.getElementById('tab' + name).classList.add('hidden');
      });
      const homeEl = document.getElementById('viewHome');
      homeEl.classList.remove('hidden');
      animateSectionEntry(homeEl);

      document.getElementById('currentViewBadge').classList.add('hidden');
      setBotAppearance('circle', '#111111');
      loadUpcomingEvents();
    }

    function selectAgent(tabName, shapeKey, colorHex) {
      triggerBotTapEffect();
      closeAgentMenu();
      currentView = tabName;
      currentBotShape = shapeKey;
      currentBotColor = colorHex;

      document.getElementById('viewHome').classList.add('hidden');
      ['schedule', 'timetable', 'tracker', 'settings'].forEach(t => {
        const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
        if (t === tabName) {
          el.classList.remove('hidden');
          animateSectionEntry(el);
        } else {
          el.classList.add('hidden');
        }
      });

      const badge = document.getElementById('currentViewBadge');
      badge.innerText = tabName.toUpperCase();
      badge.classList.remove('hidden');

      setBotAppearance(shapeKey, colorHex);
      if (tabName === 'timetable') renderTimetableGrid();
      if (tabName === 'settings') renderSettingsTab();
    }

    // =========================================================
    // HOME: GSAT COUNTDOWN, CLOCK, LOCATION
    // =========================================================
    function initGsatCountdown() {
      const savedDate = EvStore.get('romano_gsat_date') || '2027-01-22';
      updateGsatDisplay(savedDate);
    }

    function updateGsatDisplay(dateStr) {
      const target = new Date(dateStr + 'T00:00:00');
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const diffDays = Math.max(0, Math.ceil((target - now) / (1000 * 60 * 60 * 24)));
      document.getElementById('gsatDaysLeft').innerText = diffDays;
      document.getElementById('gsatTargetLabel').innerText = dateStr.replace(/-/g, '.');
    }

    function promptGsatDate() {
      const current = EvStore.get('romano_gsat_date') || '2027-01-22';
      const next = prompt('Target GSAT Date (YYYY-MM-DD):', current);
      if (next && /^\d{4}-\d{2}-\d{2}$/.test(next.trim())) {
        EvStore.set('romano_gsat_date', next.trim());
        updateGsatDisplay(next.trim());
      }
    }

    function initTelemetry() {
      const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      function updateTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('homeClock').innerText = `${h}:${m}`;
        document.getElementById('homeDate').innerText = `${months[now.getMonth()]} ${now.getDate()}`;
      }
      updateTime();
      setInterval(updateTime, 10000);

      const savedLoc = EvStore.get('romano_last_loc');
      if (savedLoc) document.getElementById('trackerSubLocation').innerText = savedLoc;
      pingSatellite(true);
    }

    function pingSatellite(silent) {
      const dot = document.getElementById('locPingDot');
      if (dot) dot.style.backgroundColor = '#F5B82E';
      if (!navigator.geolocation) return;

      navigator.geolocation.getCurrentPosition(pos => {
        const locStr = `${pos.coords.latitude.toFixed(1)}, ${pos.coords.longitude.toFixed(1)}`;
        document.getElementById('trackerSubLocation').innerText = locStr;
        EvStore.set('romano_last_loc', locStr);
        if (dot) dot.style.backgroundColor = '#34C77B';
        if (!silent) showToast('Location updated');
      }, () => {
        if (dot) dot.style.backgroundColor = '#EA4335';
      });
    }

    // =========================================================
    // UPCOMING EVENTS & GOOGLE TASKS (INSTANT CACHE + SYNC)
    // =========================================================
    function loadUpcomingEvents() {
      const icon = document.getElementById('eventsRefreshIcon');
      if (icon) icon.classList.add('fa-spin');

      callBackend('getUpcomingEvents', { calendarIds: visibleCalendarIds, maxResults: 3 },
        function(events) {
          if (icon) icon.classList.remove('fa-spin');
          cachedUpcomingEvents = events || [];
          EvStore.setJSON('romano_cache_events', cachedUpcomingEvents);
          renderUpcomingEvents(cachedUpcomingEvents);
        },
        function() {
          if (icon) icon.classList.remove('fa-spin');
          renderUpcomingEvents(cachedUpcomingEvents);
        }
      );
    }

    function renderUpcomingEvents(events) {
      const box = document.getElementById('upcomingEventsList');
      if (!box) return;
      box.innerHTML = '';

      const list = events || [];
      for (let i = 0; i < 3; i++) {
        const ev = list[i];

          box.innerHTML += `
            <div class="px-4 py-3 rounded-2xl bg-[#F7F7F7] border border-gray-200/75 flex items-center justify-between gap-3">

                <div class="text-sm font-bold text-[#111111] truncate">${ev.title}</div>
                <div class="text-[11px] font-semibold text-gray-400 truncate">${ev.calendarName || ''}</div>
              </div>
              <span class="text-xs font-extrabold text-gray-500 shrink-0">${ev.timeLabel || ''}</span>
            </div>
          `;
        } else {
          box.innerHTML += `
            <div class="px-4 py-3.5 rounded-2xl bg-[#F7F7F7] border border-gray-200/50 flex items-center justify-between">
              <span class="text-sm font-semibold text-gray-300">${i === 0 ? 'No upcoming events' : '—'}</span>
            </div>
          `;
        }
      }
    }

    function syncGoogleTasks() {
      const icon = document.getElementById('tasksSyncIcon');
      if (icon) icon.classList.add('fa-spin');

      callBackend('getGoogleTasks', null,
        function(tasks) {
          if (icon) icon.classList.remove('fa-spin');
          if (Array.isArray(tasks)) {
            todoItems = tasks;
            EvStore.setJSON('romano_cache_tasks', todoItems);
            renderTodos();
          }
        },
        function(err) {
          if (icon) icon.classList.remove('fa-spin');
          if (!todoItems.length) {
            const container = document.getElementById('todoListContainer');
            if (container) {
              container.innerHTML = `<div class="text-xs text-red-500 py-1 leading-tight">${err.message || 'Tasks sync error'}</div>`;
            }
          }
        }
      );
    }

    function renderTodos() {
      const container = document.getElementById('todoListContainer');
      if (!container) return;
      container.innerHTML = '';

      if (!todoItems.length) {
        container.innerHTML = '<div class="text-sm font-medium text-gray-300 py-2">All clear</div>';
        return;
      }

      todoItems.forEach((item, idx) => {
        container.innerHTML += `
          <label class="flex items-center gap-2.5 py-1.5 cursor-pointer group">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleTodoItem('${item.id}', '${item.listId || ''}', this.checked, ${idx})" class="w-4 h-4 rounded accent-black cursor-pointer shrink-0">
            <span class="text-sm font-bold truncate ${item.done ? 'line-through text-gray-300' : 'text-[#111111]'}">${item.title}</span>
          </label>
        `;
      });
    }

    function addTodoItem() {
      const input = document.getElementById('newTodoInput');
      const title = input.value.trim();
      if (!title) return;
      input.value = '';

      const tempItem = { id: 'TEMP_' + Date.now(), listId: '', title: title, done: false };
      todoItems.unshift(tempItem);
      EvStore.setJSON('romano_cache_tasks', todoItems);
      renderTodos();

      callBackend('addGoogleTask', { title: title }, function(created) {
        if (created && created.id) {
          tempItem.id = created.id;
          tempItem.listId = created.listId || '';
          EvStore.setJSON('romano_cache_tasks', todoItems);
        }
      }, function(err) {
        showToast(err.message);
      });
    }

    function toggleTodoItem(taskId, listId, isChecked, idx) {
      if (todoItems[idx]) todoItems[idx].done = isChecked;
      renderTodos();

      callBackend('toggleGoogleTask', { id: taskId, listId: listId, completed: isChecked }, function() {
        setTimeout(() => {
          todoItems = todoItems.filter(t => !t.done);
          EvStore.setJSON('romano_cache_tasks', todoItems);
          renderTodos();
        }, 350);
      });
    }

    // =========================================================
    // REQUIREMENT #3: FIX TRACKER TIMER DUPLICATE LOGGING BUG
    // =========================================================
    function clearAllTimerStorage() {
      EvStore.del('gsat_timer_state');
      EvStore.del('gsat_timer_subject');
      EvStore.del('gsat_timer_accumulated');
      EvStore.del('gsat_timer_segment_start');
    }

    function checkPersistedTimer() {
      var st = EvStore.get('gsat_timer_state');
      if (st === 'RUNNING' || st === 'PAUSED') {
        timerState = st;
        currentSubject = EvStore.get('gsat_timer_subject') || '數學';
        accumulatedMs = parseInt(EvStore.get('gsat_timer_accumulated') || '0', 10);
        var savedStart = EvStore.get('gsat_timer_segment_start');
        currentSegmentStartMs = savedStart ? parseInt(savedStart, 10) : null;
        updateSubjectUI(currentSubject);
        if (timerState === 'RUNNING') {
          setUIRunning();
          updateClockDisplay();
          timerInterval = setInterval(updateClockDisplay, 1000);
        } else {
          setUIPaused();
          updateClockDisplay();
        }
      } else {
        clearAllTimerStorage();
      }
    }

    function saveTimerStorage() {
      EvStore.set('gsat_timer_state', timerState);
      EvStore.set('gsat_timer_subject', currentSubject);
      EvStore.set('gsat_timer_accumulated', accumulatedMs.toString());
      if (currentSegmentStartMs) EvStore.set('gsat_timer_segment_start', currentSegmentStartMs.toString());
      else EvStore.del('gsat_timer_segment_start');
    }

    function getTotalElapsedMs() {
      var total = accumulatedMs;
      if (timerState === 'RUNNING' && currentSegmentStartMs) total += (Date.now() - currentSegmentStartMs);
      return total;
    }

    function updateClockDisplay() {
      var s = Math.floor(getTotalElapsedMs() / 1000);
      document.getElementById('timer-display').innerText =
        String(Math.floor(s / 3600)).padStart(2, '0') + ':' +
        String(Math.floor((s % 3600) / 60)).padStart(2, '0') + ':' +
        String(s % 60).padStart(2, '0');
    }

    function updateSubjectUI(subj) {
      document.getElementById('current-track-badge').innerText = subj;
      document.querySelectorAll('#subject-selector button').forEach(b => {
        b.classList.toggle('b-tag-active', b.dataset.subj === subj);
      });
      renderUnitTags();
    }

    function setSubject(subj) {
      if (timerState !== 'IDLE') { showToast('Stop timer first'); return; }
      currentSubject = subj;
      selectedUnits = [];
      updateSubjectUI(subj);
    }

    function startTimer() {
      timerState = 'RUNNING';
      currentSegmentStartMs = Date.now();
      accumulatedMs = 0;
      saveTimerStorage();
      setUIRunning();
      updateClockDisplay();
      timerInterval = setInterval(updateClockDisplay, 1000);
    }

    function togglePauseResume() {
      if (timerState === 'RUNNING') {
        clearInterval(timerInterval);
        accumulatedMs += (Date.now() - currentSegmentStartMs);
        currentSegmentStartMs = null;
        timerState = 'PAUSED';
        saveTimerStorage();
        setUIPaused();
      } else {
        currentSegmentStartMs = Date.now();
        timerState = 'RUNNING';
        saveTimerStorage();
        setUIRunning();
        timerInterval = setInterval(updateClockDisplay, 1000);
      }
    }

    // Immediately wipe local storage and reset UI BEFORE async network call
    // so reopening the app NEVER prompts to log the same session twice!
    function commitTimer() {
      clearInterval(timerInterval);
      var elapsedMs = getTotalElapsedMs();
      var hours = elapsedMs / (1000 * 60 * 60);
      var subjToLog = currentSubject;

      // 1. Immediately clear persisted state & reset UI
      clearAllTimerStorage();
      resetTimerUI();

      if (hours <= 0.0005) {
        showToast('Session cleared');
        return;
      }

      showToast(`Logging +${hours.toFixed(2)}h...`);

      // 2. Send to Google Sheet in background
      callBackend('apiRecordTime', { subject: subjToLog, elapsedHours: hours },
        function() {
          showToast(`+${hours.toFixed(2)}h saved`);
        },
        function(err) {
          showToast('Sync error: ' + err.message);
        }
      );
    }

    function resetTimerUI() {
      clearAllTimerStorage();
      timerState = 'IDLE';
      currentSegmentStartMs = null;
      accumulatedMs = 0;
      document.getElementById('start-btn').classList.remove('hidden');
      document.getElementById('running-actions').classList.add('hidden');
      document.getElementById('terminal-state').innerText = 'IDLE';
      document.getElementById('pulse-dot').className = 'w-2.5 h-2.5 rounded-full bg-gray-300';
      document.getElementById('timer-status').innerText = 'Ready';
      document.getElementById('timer-display').innerText = '00:00:00';
    }

    function setUIRunning() {
      document.getElementById('start-btn').classList.add('hidden');
      document.getElementById('running-actions').classList.remove('hidden');
      setBtnText('pause-resume-btn', 'Pause');
      document.getElementById('terminal-state').innerText = 'ACTIVE';
      document.getElementById('pulse-dot').className = 'w-2.5 h-2.5 rounded-full bg-[#34C77B] animate-ping';
      document.getElementById('timer-status').innerText = `Studying ${currentSubject}`;
    }

    function setUIPaused() {
      document.getElementById('start-btn').classList.add('hidden');
      document.getElementById('running-actions').classList.remove('hidden');
      setBtnText('pause-resume-btn', 'Resume');
      document.getElementById('terminal-state').innerText = 'PAUSED';
      document.getElementById('pulse-dot').className = 'w-2.5 h-2.5 rounded-full bg-[#F5B82E]';
      document.getElementById('timer-status').innerText = 'Paused';
    }

    function applyCalendarsList(calendars) {

    function createTagBtn(text, clickHandler, isActive) {

      btn.innerText = text;
      btn.onclick = function() { clickHandler(btn); };

      var btn = document.getElementById(btnId);
      if (!btn) return;
      var span = btn.querySelector('.btn-text');
      if (span) span.innerText = newText;
      else btn.innerText = newText;

    function showToast(msg) {
      var t = document.getElementById('toast');
      if (!t) return;
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2200);
    }

    function applyPresetsData(data) {
      if (!data) return;
      if (data.titles && data.titles.length) { dbTitles = data.titles; EvStore.setJSON('romano_cache_titles', dbTitles); }
      if (data.times && data.times.length) { dbTimes = data.times; periodTimes = data.times; EvStore.setJSON('romano_cache_times', dbTimes); }
      if (data.subjects && data.subjects.length) { dbSubjects = data.subjects; EvStore.setJSON('romano_cache_subjects', dbSubjects); }
      if (data.subjectColors) { dbSubjectColors = data.subjectColors; EvStore.setJSON('romano_cache_subj_colors', dbSubjectColors); }
      if (data.settings) { appSettings = data.settings; EvStore.setJSON('romano_cache_settings', appSettings); }
      renderTags();
      if (currentView === 'timetable') renderTimetableGrid();
      if (currentView === 'settings') renderSettingsTab();

    function renderTags() {
      var titleContainer = document.getElementById('titleTags');
      if (!titleContainer) return;
      titleContainer.innerHTML = '';
      dbTitles.forEach(function(t) {
        var btn = createTagBtn(t, function(b) {
          if (selectedTitle === t) {
            selectedTitle = null;
            document.getElementById('eventTitle').value = '';
            b.classList.remove('b-tag-active');
          } else {
            selectedTitle = t;
            document.getElementById('eventTitle').value = t;
            titleContainer.querySelectorAll('button').forEach(bx => bx.classList.remove('b-tag-active'));
            b.classList.add('b-tag-active');
          }
        }, selectedTitle === t);
        titleContainer.appendChild(btn);
      });

      var timeContainer = document.getElementById('timeTags');
      if (!timeContainer) return;
      timeContainer.innerHTML = '';
      dbTimes.forEach(function(t) {
        var str = `${t.label} (${t.start})`;
        var btn = createTagBtn(str, function(b) {
          if (selectedTimeLabel === t.label) {
            selectedTimeLabel = null;
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            b.classList.remove('b-tag-active');
          } else {
            selectedTimeLabel = t.label;
            document.getElementById('startTime').value = t.start;
            document.getElementById('endTime').value = t.end;
            timeContainer.querySelectorAll('button').forEach(bx => bx.classList.remove('b-tag-active'));
            b.classList.add('b-tag-active');
          }
        }, selectedTimeLabel === t.label);
        timeContainer.appendChild(btn);
      });

        selectedDateOffset = offset;

    function submitEvent() {
      var payload = {
        calendarId: document.getElementById('calendarSelect').value,
        title: document.getElementById('eventTitle').value.trim(),
        date: document.getElementById('eventDate').value,
        start: document.getElementById('startTime').value,
        end: document.getElementById('endTime').value,
        location: document.getElementById('eventLocation').value.trim(),
        description: document.getElementById('eventDesc').value.trim()
      };
      if (!payload.title || !payload.date || !payload.start || !payload.end) {
        showToast('Missing fields');
        return;
      }

      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      setBtnText('submitBtn', 'Saving...');

      callBackend('addCalendarEvent', payload,
        function() {
          showToast('Event added');
          btn.disabled = false;
          setBtnText('submitBtn', 'Add Event');
          document.getElementById('eventTitle').value = "";
          document.getElementById('eventDesc').value = "";
          selectedTitle = null;
          renderTags();
          loadUpcomingEvents();
        },
        function(err) {
          showToast(err.message);
          btn.disabled = false;
          setBtnText('submitBtn', 'Add Event');
        }
      );
    }

      });

    function navigateWeek(dir) {
      currentWeekOffset = (dir === 0) ? 0 : currentWeekOffset + dir;
      renderTimetableGrid();
    }

    function getCurrentWeekDates() {
      var now = new Date();
      var day = now.getDay();
      var diff = (day === 0 ? -6 : 1 - day) + (currentWeekOffset * 7);
      var dates = [];
      for (var i = 0; i < 5; i++) {
        var d = new Date(now);
        d.setDate(now.getDate() + diff + i);
        dates.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
      }
      return dates;
    }

    function getSubjectStyle(subject) {
      if (!subject) return 'background:#F9FAFB; color:#D1D5DB;';
      var hex = dbSubjectColors[subject] || '#111111';
      return `background:${hex}15; color:${hex}; border:1.5px solid ${hex}40;`;
    }

    function renderTimetableGrid() {
      var tbody = document.getElementById('timetableBody');
      var headerRow = document.getElementById('timetableHeaderRow');
      if (!tbody || !headerRow) return;
      tbody.innerHTML = '';
      var weekDates = getCurrentWeekDates();
      var days = ['M', 'T', 'W', 'T', 'F'];
      document.getElementById('weekRangeLabel').innerText = `${weekDates[0].slice(5)} — ${weekDates[4].slice(5)}`;
      document.getElementById('weekRelativeLabel').innerText = currentWeekOffset === 0 ? 'Current' : (currentWeekOffset > 0 ? `+${currentWeekOffset}w` : `${currentWeekOffset}w`);

      headerRow.innerHTML = '<th class="p-1.5 w-10">#</th>';
      for (var d = 0; d < 5; d++) {
        headerRow.innerHTML += `<th class="p-1.5"><div class="font-bold text-[#111111]">${days[d]}</div><div class="text-[9px] text-gray-400">${weekDates[d].slice(8)}</div></th>`;
      }

      updateSwapsBanner(weekDates);
      var totalPeriods = appSettings.totalPeriods || 8;

      for (var p = 0; p < totalPeriods; p++) {
        var tr = document.createElement('tr');
        var tdHtml = `<td class="p-1 text-[10px] font-bold text-gray-400 bg-gray-50/60">P${p + 1}</td>`;
        for (var d2 = 0; d2 < 5; d2++) {
          var dateStr = weekDates[d2];
          var raw = (timetableData[p] && timetableData[p][d2]) ? timetableData[p][d2] : '';
          var swapIn = swapRecords.find(r => r.toDate === dateStr && r.toPeriod === (p + 1));
          var display = raw;
          var dot = '';
          if (swapIn) {
            var origIdx = getWeekdayIndex(swapIn.fromDate);
            display = (timetableData[swapIn.fromPeriod - 1] && timetableData[swapIn.fromPeriod - 1][origIdx]) || raw;
            dot = '<span class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-amber-500"></span>';
          }
          tdHtml += `<td class="p-1"><div onclick="editTimetableCell(${p},${d2})" class="relative min-h-[40px] rounded-lg flex items-center justify-center font-bold text-xs cursor-pointer transition" style="${getSubjectStyle(display)}">${display || '·'}${dot}</div></td>`;
        }
        tr.innerHTML = tdHtml;
        tbody.appendChild(tr);
      }
    }

    function editTimetableCell(p, d) {
      const cur = (timetableData[p] && timetableData[p][d]) || '';
      const next = prompt(`P${p + 1} Subject:`, cur);
      if (next !== null) {
        if (!timetableData[p]) timetableData[p] = ['', '', '', '', ''];
        timetableData[p][d] = next.trim();
        EvStore.setJSON('romano_cache_timetable', timetableData);
        renderTimetableGrid();
      }
    }

    function getWeekdayIndex(dateStr) {
      var day = new Date(dateStr).getDay();
      return (day >= 1 && day <= 5) ? day - 1 : 0;
    }

    function updateSwapsBanner(weekDates) {
      var banner = document.getElementById('activeSwapsBanner');
      var active = swapRecords.filter(r => weekDates.includes(r.fromDate) || weekDates.includes(r.toDate));
      if (active.length > 0) {
        banner.classList.remove('hidden');
        document.getElementById('swapCountText').innerText = active.length;
      } else {
        banner.classList.add('hidden');
      }
    }

    function saveTimetableToCloud() {
      var btn = document.getElementById('syncMatrixBtn');
      btn.disabled = true;
      setBtnText('syncMatrixBtn', 'Saving...');
      EvStore.setJSON('romano_cache_timetable', timetableData);
      callBackend('saveTimetableData', timetableData,
        function() {
          showToast('Timetable saved');
          btn.disabled = false;
          setBtnText('syncMatrixBtn', 'Save Timetable');
        },
        function() {
          btn.disabled = false;
          setBtnText('syncMatrixBtn', 'Save Timetable');
        }
      );
    }

    function openSwapModal() {
      populatePeriodSelect('swapA_Period');
      populatePeriodSelect('swapB_Period');
      var today = new Date().toISOString().split('T')[0];
      document.getElementById('swapA_Date').value = today;
      document.getElementById('swapB_Date').value = today;
      document.getElementById('swapNote').value = '';
      multiSwapSteps = [{ date: today, period: 1 }, { date: today, period: 2 }, { date: today, period: 3 }];
      renderMultiSwapSteps();
      switchSwapMode('two');
      document.getElementById('swapModal').classList.remove('hidden');
    }
    function closeSwapModal() { document.getElementById('swapModal').classList.add('hidden'); }
    function populatePeriodSelect(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = '';
      for (var i = 1; i <= (appSettings.totalPeriods || 8); i++) el.innerHTML += `<option value="${i}">P${i}</option>`;
    }
    function switchSwapMode(mode) {
      currentSwapMode = mode;
      document.getElementById('swapModeTwoView').classList.toggle('hidden', mode !== 'two');
      document.getElementById('swapModeMultiView').classList.toggle('hidden', mode === 'two');
    }
    function addMultiSwapStep() {
      multiSwapSteps.push({ date: new Date().toISOString().split('T')[0], period: 1 });
      renderMultiSwapSteps();
    }
    function renderMultiSwapSteps() {
      var c = document.getElementById('multiSwapStepsContainer');
      c.innerHTML = '';
      multiSwapSteps.forEach((s, i) => {
        var opts = '';
        for (var p = 1; p <= (appSettings.totalPeriods || 8); p++) opts += `<option value="${p}" ${s.period===p?'selected':''}>P${p}</option>`;
        c.innerHTML += `<div class="flex items-center gap-1.5"><span class="text-xs font-bold w-4">${i+1}</span><input type="date" value="${s.date}" onchange="multiSwapSteps[${i}].date=this.value" class="b-input px-2 py-1 text-xs"><select onchange="multiSwapSteps[${i}].period=parseInt(this.value)" class="b-input px-2 py-1 text-xs flex-1">${opts}</select></div>`;
      });
    }
    function commitSwapRecord() {
      var note = document.getElementById('swapNote').value.trim();
      var groupId = 'GRP_' + Date.now();
      if (currentSwapMode === 'two') {
        var dA = document.getElementById('swapA_Date').value, pA = parseInt(document.getElementById('swapA_Period').value);
        var dB = document.getElementById('swapB_Date').value, pB = parseInt(document.getElementById('swapB_Period').value);
        swapRecords.push({ id: `S_${Date.now()}_1`, fromDate: dA, fromPeriod: pA, toDate: dB, toPeriod: pB, note, chainGroup: groupId });
        swapRecords.push({ id: `S_${Date.now()}_2`, fromDate: dB, fromPeriod: pB, toDate: dA, toPeriod: pA, note, chainGroup: groupId });
      } else {
        var n = multiSwapSteps.length;
        for (var i = 0; i < n; i++) {
          var from = multiSwapSteps[i], to = multiSwapSteps[(i + 1) % n];
          swapRecords.push({ id: `S_${Date.now()}_${i}`, fromDate: from.date, fromPeriod: from.period, toDate: to.date, toPeriod: to.period, note, chainGroup: groupId });
        }
      }
      EvStore.setJSON('romano_cache_swaps', swapRecords);
      callBackend('saveSwapRecords', swapRecords);
      renderTimetableGrid();
      closeSwapModal();
      showToast('Swap saved');
    }
    function openSwapListModal() {
      var c = document.getElementById('swapListModalContent');
      c.innerHTML = '';
      swapRecords.forEach((r, idx) => {
        c.innerHTML += `<div class="p-2.5 bg-gray-50 rounded-xl flex justify-between items-center text-xs"><span>${r.fromDate.slice(5)} P${r.fromPeriod} → ${r.toDate.slice(5)} P${r.toPeriod}</span><button onclick="deleteSwapRecord(${idx})" class="text-red-500 font-bold">Del</button></div>`;
      });
      document.getElementById('swapListModal').classList.remove('hidden');
    }
    function closeSwapListModal() { document.getElementById('swapListModal').classList.add('hidden'); }
    function deleteSwapRecord(idx) {
      var target = swapRecords[idx];
      if (target.chainGroup) swapRecords = swapRecords.filter(r => r.chainGroup !== target.chainGroup);
      else swapRecords.splice(idx, 1);
      EvStore.setJSON('romano_cache_swaps', swapRecords);
      callBackend('saveSwapRecords', swapRecords);
      renderTimetableGrid();
      openSwapListModal();
    }

    function renderUnitTags() {
      var c = document.getElementById('unit-tag-container');
      if (!c) return;
      c.innerHTML = '';
      var list = unitsCache[currentSubject] || [];
      if (!list.length) {
        c.innerHTML = '<span class="text-xs text-gray-400">No topics loaded</span>';
        return;
      }
      list.forEach(u => {
        var btn = createTagBtn(u, () => {
          if (selectedUnits.includes(u)) selectedUnits = selectedUnits.filter(x => x !== u);
          else selectedUnits.push(u);
          renderUnitTags();
        }, selectedUnits.includes(u));
        c.appendChild(btn);
      });
      document.getElementById('selected-units-preview').innerText = selectedUnits.length ? selectedUnits.join(', ') : 'None';
    }
    function clearSelectedUnits() { selectedUnits = []; renderUnitTags(); }

    function saveProgress() {
      var unitStr = selectedUnits.join(', ');
      var isDone = document.getElementById('is-completed').checked;
      var note = document.getElementById('note-input').value.trim();
      if (!unitStr && !note) { showToast('Select topic or note'); return; }
      var btn = document.getElementById('progress-btn');
      btn.disabled = true;
      callBackend('apiRecordProgress', { subject: currentSubject, unit: unitStr, isCompleted: isDone, note: note },
        function() {
          showToast('Progress saved');
          btn.disabled = false;
          document.getElementById('note-input').value = '';
          selectedUnits = [];
          renderUnitTags();
        },
        function() { btn.disabled = false; }
      );
    }

    const BLOUB_SWATCHES = ['#111111','#8C6239','#EA4335','#F28B30','#F5B82E','#34C77B','#2CC597','#3B96F3','#7B61FF','#E5489A','#8E9297'];

    function renderSettingsTab() {
      renderCalendarVisibilitySettings();
      var list = document.getElementById('subjectColorList');
      list.innerHTML = '';
      dbSubjects.forEach((sub, idx) => {
        var c = dbSubjectColors[sub] || '#111111';
        var dots = BLOUB_SWATCHES.map(sw =>
          `<button onclick="updateSubjectHexColor('${sub}','${sw}')" class="w-4 h-4 rounded-full border ${c.toLowerCase()===sw.toLowerCase()?'scale-125 ring-1 ring-black':'border-transparent'}" style="background:${sw}"></button>`
        ).join('');
        list.innerHTML += `
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-gray-50 text-xs font-bold">
            <span>${sub}</span>
            <div class="flex items-center gap-1">${dots}<button onclick="removeSubject(${idx})" class="ml-1.5 text-gray-400 hover:text-red-500">✕</button></div>
          </div>`;
      });
    }
    function updateSubjectHexColor(sub, hex) {
      dbSubjectColors[sub] = hex;
      EvStore.setJSON('romano_cache_subj_colors', dbSubjectColors);
      renderSettingsTab();
      renderTimetableGrid();
    }
    function addCustomSubjectPrompt() {
      var name = prompt('Subject name:');
      if (name && name.trim() && !dbSubjects.includes(name.trim())) {
        dbSubjects.push(name.trim());
        dbSubjectColors[name.trim()] = '#3B96F3';
        EvStore.setJSON('romano_cache_subjects', dbSubjects);
        renderSettingsTab();
      }
    }
    function removeSubject(idx) {
      var name = dbSubjects[idx];
      dbSubjects.splice(idx, 1);
      delete dbSubjectColors[name];
      EvStore.setJSON('romano_cache_subjects', dbSubjects);
      renderSettingsTab();
    }
    function updateTotalPeriods(val) {
      appSettings.totalPeriods = parseInt(val) || 8;
      EvStore.setJSON('romano_cache_settings', appSettings);
      renderTimetableGrid();
    }
    function toggleSwapPulse(checked) {
      appSettings.showSwapPulse = checked;
      EvStore.setJSON('romano_cache_settings', appSettings);
      renderTimetableGrid();
    }
    function saveAllSettingsToCloud() {
      var btn = document.getElementById('saveSettingsBtn');
      btn.disabled = true;
      callBackend('savePresetsData', { subjects: dbSubjects, subjectColors: dbSubjectColors, settings: appSettings },
        function() { showToast('Settings saved'); btn.disabled = false; },
        function() { btn.disabled = false; }
      );
    }

    // =========================================================
    // REQUIREMENT #2: INSTANT BOOT + SINGLE-ROUNDTRIP SYNC
    // =========================================================
    function fallbackParallelSync() {
      loadUserCalendars();
      syncGoogleTasks();
      callBackend('getPresetsData', null, applyPresetsData);
      callBackend('getTimetableData', null, function(data) {
        if (Array.isArray(data)) {
          timetableData = data;
          EvStore.setJSON('romano_cache_timetable', data);
          if (currentView === 'timetable') renderTimetableGrid();
        }
      });
      callBackend('getSwapRecords', null, function(data) {
        if (Array.isArray(data)) {
          swapRecords = data;
          EvStore.setJSON('romano_cache_swaps', data);
        }
      });
      callBackend('apiGetSubjectUnits', null, function(data) {
        if (data) {
          unitsCache = data;
          EvStore.setJSON('romano_cache_units', data);
          renderUnitTags();
        }
      });
    }

    function sysInit() {
      // 1. Instant 0.01s Render from Local Cache
      initAutonomousBotLife();
      initBotGestures();
      initGsatCountdown();
      initTelemetry();
      renderUpcomingEvents(cachedUpcomingEvents);
      renderTodos();
      renderTags();
      renderUnitTags();
      if (allUserCalendars.length) applyCalendarsList(allUserCalendars);
      checkPersistedTimer();

      // 2. Single-Batch Cloud Sync (Automatically falls back to parallel sync if GAS not updated yet)
      callBackend('getInitialBundle', { calendarIds: visibleCalendarIds, maxResults: 3 },
        function(bundle) {
          if (!bundle) { fallbackParallelSync(); return; }
          if (bundle.calendars) applyCalendarsList(bundle.calendars);
          if (bundle.upcomingEvents) {
            cachedUpcomingEvents = bundle.upcomingEvents;
            EvStore.setJSON('romano_cache_events', cachedUpcomingEvents);
            renderUpcomingEvents(cachedUpcomingEvents);
          }
          if (bundle.tasks) {
            todoItems = bundle.tasks;
            EvStore.setJSON('romano_cache_tasks', todoItems);
            renderTodos();
          }
          if (bundle.presets) applyPresetsData(bundle.presets);
          if (Array.isArray(bundle.timetable)) {
            timetableData = bundle.timetable;
            EvStore.setJSON('romano_cache_timetable', timetableData);
          }
          if (Array.isArray(bundle.swaps)) {
            swapRecords = bundle.swaps;
            EvStore.setJSON('romano_cache_swaps', swapRecords);
          }
          if (bundle.units) {
            unitsCache = bundle.units;
            EvStore.setJSON('romano_cache_units', unitsCache);
            renderUnitTags();
          }
        },
        function() {
          // If 'getInitialBundle' isn't in Code.gs yet, run parallel fetch immediately
          fallbackParallelSync();
        }
      );
    }

    sysInit();
  </script>
</body>
</html>
